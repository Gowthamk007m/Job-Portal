{% for job in jobs %}
<div class="job-item p-4 mb-4 border border-3 rounded-3">
    <div class="row g-4">
        <div class="col-sm-12 col-md-8 d-flex align-items-center">
            <div class="text-start ps-4">
                <h5 class="mb-3">{{ job.job_title }}</h5>
                <span class="text-truncate me-3">
                    <i class="fa fa-map-marker-alt text-primary me-2"></i>
                    {{ job.location }}
                </span>
                <span class="text-truncate me-3">
                    <i class="far fa-clock text-primary me-2"></i>
                    Full Time
                </span>
                <span class="text-truncate me-0">
                    <i class="far fa-money-bill-alt text-primary me-2"></i>
                    ${{ job.salary_from }} - ${{ job.salary_to }}
                </span>
            </div>
        </div>
        <div class="col-sm-12 col-md-4 d-flex flex-column align-items-start align-items-md-end justify-content-center">
            <div class="d-flex mb-3">
                <a class="btn btn-light btn-square me-3" href="#">
                    <i class="far fa-heart text-primary"></i>
                </a>
                <a class="btn btn-primary" href="#">Apply Now</a>
            </div>
            <small class="text-truncate">
                <i class="far fa-calendar-alt text-primary me-2"></i>
                Date Line: {{ job.expected_joining_date|date:"d M, Y" }}
            </small>
        </div>
    </div>
</div>
{% endfor %}

{% if jobs.has_next %}
<div id="load-more" class="text-center mt-4">
    <button class="btn btn-primary" id="load-more-btn"
            hx-get="{% url 'jobs:home' %}?page={{ jobs.next_page_number }}&q={{ search_query }}"
            hx-target="#load-more"
            hx-swap="outerHTML">
        Load More
    </button>
</div>
{% endif %}
